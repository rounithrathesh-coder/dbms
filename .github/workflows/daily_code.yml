name: Daily Practice Sync

on:
  schedule:
    # Runs everyday at 01:45 UTC (07:15 AM IST) so it completes before 08:00 AM IST
    - cron: '45 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync daily solution
        id: run_solution
        run: |
          OUTPUT=$(python3 .github/scripts/daily_push.py)
          echo "$OUTPUT"
          COMMIT_MSG=$(echo "$OUTPUT" | grep "^COMMIT_MSG:" | cut -d':' -f2- || true)
          if [ -z "$COMMIT_MSG" ]; then
            COMMIT_MSG="feat(daily): solve daily challenge and update progress log"
          fi
          echo "msg=$COMMIT_MSG" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        env:
          GIT_AUTHOR_NAME: "Rounith Rathesh"
          GIT_AUTHOR_EMAIL: "rounithrathesh@gmail.com"
          GIT_COMMITTER_NAME: "Rounith Rathesh"
          GIT_COMMITTER_EMAIL: "rounithrathesh@gmail.com"
        run: |
          git config --global user.name "rounithrathesh-coder"
          git config --global user.email "rounithrathesh@gmail.com"
          git config --global author.name "Rounith Rathesh"
          git config --global author.email "rounithrathesh@gmail.com"
          git config --global committer.name "Rounith Rathesh"
          git config --global committer.email "rounithrathesh@gmail.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "${{ steps.run_solution.outputs.msg }}"
            git push origin main
          fi
